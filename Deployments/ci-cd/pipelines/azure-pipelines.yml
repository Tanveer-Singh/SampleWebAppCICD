trigger: none
pr: none

name: '1.0.$(Date:yyyyMMdd).$(Rev:r)'

lockBehavior: sequential

pool:
  name: 'SelfHosted-Windows-Agent'

# =========================================================
# PARAMETERS
# =========================================================
parameters:

- name: serviceName
  type: string
  default: 'ClaimServiceAPI'
  values:
    - ClaimServiceAPI

- name: environmentName
  type: string
  default: 'dev'
  values:
    - dev
    - qa
    - prod

# =========================================================
# VARIABLES
# =========================================================
variables:

- name: BuildConfiguration
  value: 'Release'

- name: DotNetSdkVersion
  value: '9.0.x'

- name: RootDeploymentPath
  value: 'D:\Applications'

- name: RootBackupPath
  value: 'D:\Backup'

- name: DeploymentLogPath
  value: 'D:\DeploymentLogs'

- name: BackupRetentionDays
  value: '15'

- name: EnvironmentName
  value: '${{ parameters.environmentName }}'

- ${{ if eq(parameters.serviceName, 'ClaimServiceAPI') }}:

  - name: Service.Name
    value: 'ClaimServiceAPI'

  - name: Project.Path
    value: 'WebApplication4CICD/WebApplication4CICD.csproj'

  - name: IIS.AppPoolName
    value: 'ClaimServiceAPI'

  - name: Deployment.ServiceFolder
    value: 'ClaimServiceAPI'

  - name: HealthCheckUrl
    value: 'https://claim.company.com/health'

# =========================================================
# STAGES
# =========================================================
stages:

# =========================================================
# BUILD STAGE
# =========================================================
- stage: Build
  jobs:

  - job: BuildJob
    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '$(DotNetSdkVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: build
        projects: '$(Project.Path)'
        arguments: '--configuration $(BuildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Test'
      inputs:
        command: test
        projects: '**/*Tests/*.csproj'
      continueOnError: true

    # Publish to folder (NO ZIP)
    - task: DotNetCoreCLI@2
      displayName: 'Publish App'
      inputs:
        command: publish
        projects: '$(Project.Path)'
        arguments: >
          --configuration $(BuildConfiguration)
          --output $(Build.ArtifactStagingDirectory)\$(Service.Name)
        zipAfterPublish: false

    # Publish artifact as folder
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\$(Service.Name)'
        artifact: '$(Service.Name)'

# =========================================================
# DEPLOY STAGE
# =========================================================
- stage: Deploy
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))

  jobs:

  - deployment: DeployApp
    environment: '$(EnvironmentName)'
    strategy:
      runOnce:
        deploy:
          steps:

          # =====================================================
          # DOWNLOAD ARTIFACT (FOLDER)
          # =====================================================
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Artifact'
            inputs:
              artifact: '$(Service.Name)'
              path: '$(Pipeline.Workspace)\$(Service.Name)'

          # =====================================================
          # DEBUG (OPTIONAL BUT USEFUL)
          # =====================================================
          - task: PowerShell@2
            displayName: 'Verify Download'
            inputs:
              targetType: inline
              script: |
                Write-Host "Downloaded files:"
                Get-ChildItem "$(Pipeline.Workspace)\$(Service.Name)" -Recurse

          # =====================================================
          # BACKUP CURRENT DEPLOYMENT
          # =====================================================
          - task: PowerShell@2
            displayName: 'Backup Deployment'
            inputs:
              targetType: inline
              script: |

                $source = "$(RootDeploymentPath)\$(Deployment.ServiceFolder)"
                $backup = "$(RootBackupPath)\$(Deployment.ServiceFolder)"

                if (!(Test-Path $backup)) {
                    New-Item -ItemType Directory -Force -Path $backup
                }

                $time = Get-Date -Format "yyyyMMdd_HHmmss"
                $backupFile = "$backup\$(Service.Name)_$time.zip"

                if (Test-Path $source) {
                    Compress-Archive -Path "$source\*" -DestinationPath $backupFile -Force
                }

          # =====================================================
          # STOP IIS
          # =====================================================
          - task: PowerShell@2
            displayName: 'Stop IIS App Pool (Safe)'
            inputs:
                targetType: inline
                script: |

                  Import-Module WebAdministration

                  $appPoolName = "$(IIS.AppPoolName)"
                  $state = (Get-WebAppPoolState -Name $appPoolName).Value

                    Write-Host "Current App Pool State:$state"

                    if ($state -eq "Started") {
                        Stop-WebAppPool -Name $appPoolName
                        Write-Host "App Pool stopped successfully."
                    }
                    else {
                      Write-Host "No action needed.Already in state:$state"
                   }

          # =====================================================
          # DEPLOY (DIRECT COPY - NO EXTRACT)
          # =====================================================
          - task: PowerShell@2
            displayName: 'Deploy Application'
            inputs:
              targetType: inline
              script: |

                $source = "$(Pipeline.Workspace)\$(Service.Name)"
                $target = "$(RootDeploymentPath)\$(Deployment.ServiceFolder)"

                if (Test-Path $target) {
                    Remove-Item "$target\*" -Recurse -Force
                }

                Copy-Item "$source\*" $target -Recurse -Force

          # =====================================================
          # START IIS
          # =====================================================
          - task: PowerShell@2
            displayName: 'Start App Pool'
            inputs:
              targetType: inline
              script: |
                Import-Module WebAdministration
                Start-WebAppPool -Name "$(IIS.AppPoolName)"

          # =====================================================
          # HEALTH CHECK
          # =====================================================
          - task: PowerShell@2
            displayName: 'Health Check'
            inputs:
              targetType: inline
              script: |

                Start-Sleep -Seconds 10

                try {
                    $response = Invoke-WebRequest `
                      -Uri "$(HealthCheckUrl)" `
                      -UseBasicParsing

                    if ($response.StatusCode -eq 200) {
                      Write-Host "Health check successful."
                    }
                    else {
                      Write-Warning "Health check failed with status:$($response.StatusCode)"
                    }
                  }
                catch { 
                    Write-Warning "Application unreachable:$($_.Exception.Message)"
                 }

          # =====================================================
          # LOG DEPLOYMENT
          # =====================================================
          - task: PowerShell@2
            displayName: 'Write Log'
            inputs:
              targetType: inline
              script: |

                if (!(Test-Path "$(DeploymentLogPath)")) {
                    New-Item -ItemType Directory -Force -Path "$(DeploymentLogPath)"
                }

                $log = "$(DeploymentLogPath)\deployment.log"

                Add-Content -Path $log -Value "
                Deployment Success
                Service: $(Service.Name)
                Environment: $(EnvironmentName)
                Build: $(Build.BuildNumber)
                "