# =========================================================
# MANUAL TRIGGER ONLY
# =========================================================

trigger: none

pr: none

# =========================================================
# BUILD NUMBER
# =========================================================

name: '1.0.$(Date:yyyyMMdd).$(Rev:r)'

# =========================================================
# DEPLOYMENT LOCKING
# =========================================================

lockBehavior: sequential

# =========================================================
# AGENT POOL
# =========================================================

pool:
  name: 'SelfHosted-Windows-Agent'

# =========================================================
# PARAMETERS
# =========================================================

parameters:

# =========================================================
# MICROSERVICE SELECTION
# =========================================================

- name: serviceName

  displayName: 'Select Microservice'

  type: string

  default: 'ClaimServiceAPI'

  values:
    - ClaimServiceAPI

# =========================================================
# ENVIRONMENT SELECTION
# =========================================================

- name: environmentName

  displayName: 'Select Environment'

  type: string

  default: 'dev'

  values:
    - dev
    - qa
    - prod

# =========================================================
# VARIABLES
# =========================================================

variables:

# =========================================================
# BUILD VARIABLES
# =========================================================

- name: BuildConfiguration
  value: 'Release'

- name: DotNetSdkVersion
  value: '9.0.x'

# =========================================================
# DEPLOYMENT VARIABLES
# =========================================================

- name: RootDeploymentPath
  value: 'D:\Applications'

- name: RootBackupPath
  value: 'D:\Backup'

- name: DeploymentLogPath
  value: 'D:\DeploymentLogs'

- name: BackupRetentionDays
  value: '15'

# =========================================================
# ENVIRONMENT VARIABLES
# =========================================================

- name: EnvironmentName
  value: '${{ parameters.environmentName }}'

# =========================================================
# SERVICE VARIABLES
# =========================================================

- ${{ if eq(parameters.serviceName, 'ClaimServiceAPI') }}:

  - name: Service.Name
    value: 'ClaimServiceAPI'

  - name: Service.ShortName
    value: 'claim'

  - name: Project.Path
    value: 'WebApplication4CICD/WebApplication4CICD.csproj'

  - name: IIS.AppPoolName
    value: 'ClaimServiceAPI'

  - name: IIS.WebsiteName
    value: 'ClaimServiceAPI'

  - name: Deployment.ServiceFolder
    value: 'ClaimServiceAPI'

  - name: HealthCheckUrl
    value: 'https://claim.company.com/health'

# =========================================================
# STAGES
# =========================================================

stages:

# =========================================================
# BUILD STAGE
# =========================================================

- stage: Build

  displayName: 'Build Application'

  jobs:

  - job: BuildJob

    displayName: 'Build ASP.NET Core API'

    steps:

    # =========================================================
    # CHECKOUT
    # =========================================================

    - checkout: self

    # =========================================================
    # INSTALL .NET SDK
    # =========================================================

    - task: UseDotNet@2
      displayName: 'Install .NET 9 SDK'

      inputs:
        packageType: 'sdk'

        version: '$(DotNetSdkVersion)'

    # =========================================================
    # VERIFY .NET INSTALLATION
    # =========================================================

    - task: PowerShell@2
      displayName: 'Verify .NET SDK'

      inputs:
        targetType: 'inline'

        script: |

          dotnet --version

          dotnet --list-sdks

          dotnet --list-runtimes

    # =========================================================
    # BUILD APPLICATION
    # =========================================================

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'

      inputs:
        command: 'build'

        projects: '$(Project.Path)'

        arguments: >
          --configuration $(BuildConfiguration)
          /p:NoWarn=1998

    # =========================================================
    # RUN TESTS
    # =========================================================

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'

      inputs:
        command: 'test'

        projects: '**/*Tests/*.csproj'

        arguments: >
          --configuration $(BuildConfiguration)

      continueOnError: true

    # =========================================================
    # PUBLISH APPLICATION
    # =========================================================

    - task: DotNetCoreCLI@2
      displayName: 'Publish Application'

      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(Project.Path)'
        arguments: --configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)\publish
        zipAfterPublish: false

    # =========================================================
    # CREATE ARTIFACT DIRECTORY
    # =========================================================

    - task: PowerShell@2
      displayName: 'Create Artifact Directory'

      inputs:
        targetType: 'inline'

        script: |

          New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(Build.ArtifactStagingDirectory)\artifact"

    # =========================================================
    # CREATE ZIP PACKAGE
    # =========================================================

    - task: ArchiveFiles@2
      displayName: 'Create Artifact ZIP'

      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)\publish
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: $(Build.ArtifactStagingDirectory)\$(Service.Name)_$(Build.BuildNumber).zip
        replaceExistingArchive: true

    # =========================================================
    # VERIFY ARTIFACT FILES
    # =========================================================

    - task: PowerShell@2
      displayName: 'Verify Artifact Files'

      inputs:
        targetType: 'inline'

        script: |

          Write-Host "===================================="

          Write-Host "BUILD ARTIFACT STAGING DIRECTORY"

          Write-Host "===================================="

          Get-ChildItem `
          "$(Build.ArtifactStagingDirectory)" `
          -Recurse

    # =========================================================
    # PUBLISH PIPELINE ARTIFACT
    # =========================================================

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Pipeline Artifact'

      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)\artifact
        artifact: '$(Service.Name)'

# =========================================================
# DEPLOYMENT STAGE
# =========================================================

- stage: Deploy

  displayName: 'Deploy Application'

  dependsOn: Build

  # =========================================================
  # DEPLOY ONLY IF BUILD SUCCESSFUL
  # =========================================================

  condition: and(succeeded(),eq(variables['Build.Reason'], 'Manual'))

  jobs:

  - deployment: DeployApplication

    displayName: 'Deploy To $(EnvironmentName)'

    environment: '$(EnvironmentName)'

    strategy:

      runOnce:

        deploy:

          steps:

          # =========================================================
          # DOWNLOAD PIPELINE ARTIFACT
          # =========================================================

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Artifact'

            inputs:
              artifact: '$(Service.Name)'

              path: '$(Pipeline.Workspace)'

          # =========================================================
          # DEBUG DOWNLOADED FILES
          # =========================================================

          - task: PowerShell@2
            displayName: 'Debug Downloaded Files'

            inputs:
              targetType: 'inline'

              script: |

                Write-Host "===================================="

                Write-Host "PIPELINE WORKSPACE"

                Write-Host "===================================="

                Get-ChildItem `
                "$(Pipeline.Workspace)" `
                -Recurse

          # =========================================================
          # VALIDATE .NET RUNTIME
          # =========================================================

          - task: PowerShell@2
            displayName: 'Validate .NET Runtime'
            
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Installed .NET Runtimes:"
                  dotnet --list-runtimes
                Write-Host ""
                Write-Host "Installed .NET SDKs:"
                dotnet --list-sdks

          # =========================================================
          # BACKUP CURRENT DEPLOYMENT
          # =========================================================

          - task: PowerShell@2
            displayName: 'Backup Existing Deployment'

            inputs:
              targetType: 'inline'

              script: |

                $deploymentPath =
                "$(RootDeploymentPath)\$(Deployment.ServiceFolder)"

                $backupPath =
                "$(RootBackupPath)\$(Deployment.ServiceFolder)"

                if (!(Test-Path $backupPath)) {

                    New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $backupPath
                }

                $timestamp =
                Get-Date -Format "yyyyMMdd_HHmmss"

                $backupFile =
                "$backupPath\$(Service.Name)_$(Build.BuildNumber)_$timestamp.zip"

                if (Test-Path $deploymentPath) {

                    Compress-Archive `
                        -Path "$deploymentPath\*" `
                        -DestinationPath $backupFile `
                        -Force

                    Write-Host "Backup completed."
                }

          # =========================================================
          # Debug IIS APP POOL
          # =========================================================
          - task: PowerShell@2
            displayName: 'Debug IIS Access'
                   
            inputs:
              targetType: 'inline'

              script: |                    
                      whoami
                      Import-Module WebAdministration
                      Get-ChildItem IIS:\AppPools
          # =========================================================
          # STOP IIS APP POOL
          # =========================================================

          - task: PowerShell@2
            displayName: 'Stop IIS App Pool'

            inputs:
              targetType: 'inline'

              script: |

                Import-Module WebAdministration

                $appPoolName = "$(IIS.AppPoolName)"

                $appPoolState = (Get-WebAppPoolState -Name $appPoolName).Value

                Write-Host "Current App Pool State: $appPoolState"

                if ($appPoolState -eq "Started") {

                    Stop-WebAppPool -Name $appPoolName

                    Write-Host "App Pool stopped successfully."
                }
                else {

                    Write-Host "App Pool already stopped."
                }
          # =========================================================
          # EXTRACT ARTIFACT
          # =========================================================

          - task: ExtractFiles@1
            displayName: 'Extract Deployment Package'

            inputs:
              archiveFilePatterns: $(Pipeline.Workspace)/**/*.zip
              destinationFolder: $(Pipeline.Workspace)\Extracted
              cleanDestinationFolder: true

          # =========================================================
          # CLEAN DEPLOYMENT FOLDER
          # =========================================================

          - task: PowerShell@2
            displayName: 'Clean Deployment Folder'

            inputs:
              targetType: 'inline'

              script: |

                $deploymentPath =
                "$(RootDeploymentPath)\$(Deployment.ServiceFolder)"

                if (Test-Path $deploymentPath) {

                    Get-ChildItem `
                    $deploymentPath `
                    -Recurse |

                    Remove-Item `
                    -Recurse `
                    -Force
                }

          # =========================================================
          # COPY FILES
          # =========================================================

          - task: CopyFiles@2
            displayName: 'Copy Deployment Files'

            inputs:
              SourceFolder: '$(Pipeline.Workspace)\Extracted'
              Contents: '**'
              TargetFolder: $(RootDeploymentPath)\$(Deployment.ServiceFolder)
              OverWrite: true

          # =========================================================
          # START IIS APP POOL
          # =========================================================

          - task: PowerShell@2
            displayName: 'Start IIS App Pool'

            inputs:
              targetType: 'inline'

              script: |

                Import-Module WebAdministration

                Start-WebAppPool `
                -Name "$(IIS.AppPoolName)"

          # =========================================================
          # HEALTH CHECK
          # =========================================================

          - task: PowerShell@2
            displayName: 'Application Health Check'

            inputs:
              targetType: 'inline'

              script: |

                Start-Sleep -Seconds 15

                try {

                    $response =
                    Invoke-WebRequest `
                        -Uri "$(HealthCheckUrl)" `
                        -UseBasicParsing

                    if ($response.StatusCode -eq 200) {

                        Write-Host "Health check successful."
                    }
                    else {

                        Write-Error "Health check failed."

                        exit 1
                    }
                }
                catch {

                    Write-Error "Application unreachable."

                    exit 1
                }

          # =========================================================
          # CLEAN OLD BACKUPS
          # =========================================================

          - task: PowerShell@2
            displayName: 'Cleanup Old Backups'

            inputs:
              targetType: 'inline'

              script: |

                $backupPath =
                "$(RootBackupPath)\$(Deployment.ServiceFolder)"

                if (Test-Path $backupPath) {

                    Get-ChildItem `
                    $backupPath `
                    -Filter *.zip |

                    Where-Object {
                        $_.CreationTime -lt (Get-Date).AddDays(-$(BackupRetentionDays))
                    } |

                    Remove-Item -Force
                }

          # =========================================================
          # WRITE DEPLOYMENT LOG
          # =========================================================

          - task: PowerShell@2
            displayName: 'Write Deployment Log'

            inputs:
              targetType: 'inline'

              script: |

                if (!(Test-Path "$(DeploymentLogPath)")) {

                    New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path "$(DeploymentLogPath)"
                }

                $logFile =
                "$(DeploymentLogPath)\deployment.log"

                $message = @"

                =======================================
                Deployment Successful
                =======================================

                Service      : $(Service.Name)

                Environment  : $(EnvironmentName)

                Build Number : $(Build.BuildNumber)

                Deployed At  : $(Build.QueuedTime)

                =======================================

                "@

                Add-Content `
                -Path $logFile `
                -Value $message